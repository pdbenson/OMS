[build]
  publish = "."
  functions = "netlify/function"
  command = "npm install"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "ADMIN_EMAIL,ADMIN_NOTIFY_EMAIL,ADMIN_PASSWORD"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
    Pragma = "no-cache"

[functions."reminder-cron"]
  schedule = "0 15 * * *"
